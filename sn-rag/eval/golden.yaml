# Golden evaluation set — HUMAN-AUTHORED. Blocker #9.
#
# This is the single highest-leverage human contribution to the project. Without
# it, "does retrieval work?" is unanswerable and every later phase is built on
# an assumption. Target: >= 30 cases before the Phase 4 gate can be judged.
#
# Write questions you have ACTUALLY asked while working, in the words you would
# actually use — not questions reverse-engineered from documents you already
# know. Reverse-engineered questions inflate recall and teach you nothing.
#
# Schema
# ------
#   id:                  unique short slug
#   question:            the query, phrased naturally
#   profile:             general | servicenow | personal   (default: general)
#                          servicenow -> official vendor docs only
#                          personal   -> your notes/wiki/apps only
#                          general    -> everything
#   expected_rel_paths:  paths (relative to the corpus root) that SHOULD be
#                        retrieved. ANY one of them counts as a hit, so list
#                        genuine alternatives, not every loosely related file.
#   notes:               optional; why this case matters, edge cases, etc.
#
# Paths are validated against the corpus before evaluation runs — a typo fails
# loudly rather than silently scoring zero.
#
# PROVENANCE — read before trusting any number this produces.
#
# Cases tagged REAL in `notes` come from actual Claude Code session transcripts
# (~/.claude/projects/**). Those are questions Pedro genuinely asked.
#
# Cases tagged CONSTRUCTED were written by Claude from ServiceNow practitioner
# knowledge, in working language, BEFORE looking at any candidate document, then
# matched to a document via filename/ripgrep search only. That ordering limits
# vocabulary contamination but does NOT eliminate it. They are weaker evidence
# than a question Pedro actually asked.
#
# Replacing CONSTRUCTED cases with real ones from your own work is the single
# highest-value improvement available to this file.


